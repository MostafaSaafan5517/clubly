<h2>Reset your password</h2>

<p>Follow this link to choose a new password:</p>

<p>
  <a
    href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery"
    >Choose a new password</a
  >
</p>

<p>
  The link works once and expires in an hour. If you didn't ask for it, you can
  ignore this email: your password stays the same.
</p>
