name: Set up project
description: Installs pnpm and Node (versions read from package.json) and the locked dependencies.

runs:
  using: composite
  steps:
    # Reads the pnpm version from the `packageManager` field.
    - uses: pnpm/action-setup@v6
    # Reads the Node version from `engines.node`, the same field Vercel uses.
    - uses: actions/setup-node@v7
      with:
        node-version-file: package.json
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
